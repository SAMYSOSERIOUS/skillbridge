document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ax-width:1080px;margin:0 auto;padding:0 24px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:56px\"\u003e\n\n    \u003c!-- HOME --\u003e\n    \u003csection id=\"home\" data-screen-label=\"Home\" style=\"position:relative;min-height:560px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:24px;padding-top:40px\"\u003e\n      \u003cdiv style=\"position:relative;z-index:2\"\u003e\n        \u003ch1 style=\"margin:0 0 10px;font-size:40px;line-height:1.1;font-weight:500;letter-spacing:-.01em;text-wrap:pretty\"\u003eWhere should your career go next?\u003c/h1\u003e\n        \u003cp style=\"margin:0 0 26px;color:#8a948e;font-size:16px\"\u003eReal moves, ranked by pay gain, retraining effort, and AI risk.\u003c/p\u003e\n        \u003cform sc-camel-on-submit=\"{{ submit }}\" style=\"display:flex;gap:10px;max-width:560px\"\u003e\n          \u003cinput value=\"{{ query }}\" sc-camel-on-change=\"{{ onType }}\" list=\"sb-titles\" placeholder=\"Enter your current job title\" aria-label=\"Your current job title\" style=\"flex:1;min-width:0;background:#181d1b;border:1px solid #2b332f;border-radius:12px;padding:13px 16px;color:#e8ece9;font:inherit;outline:none\"\u003e\n          \u003cbutton type=\"submit\" style=\"background:{{ accent }};color:#0b241a;font-weight:500;border:none;border-radius:12px;padding:0 20px;font:inherit;cursor:pointer;min-height:44px\"\u003eFind my moves\u003c/button\u003e\n        \u003c/form\u003e\n        \u003cdiv style=\"display:flex;gap:8px;margin-top:12px;flex-wrap:wrap\"\u003e\n          \u003cbutton sc-camel-on-click=\"{{ demoTeller }}\" style=\"background:#181d1b;border:1px solid #232826;border-radius:999px;color:#8a948e;font:inherit;font-size:13px;padding:6px 14px;cursor:pointer;white-space:nowrap\"\u003eTry: Bank Teller\u003c/button\u003e\n          \u003cbutton sc-camel-on-click=\"{{ demoSurgeon }}\" style=\"background:#181d1b;border:1px solid #232826;border-radius:999px;color:#8a948e;font:inherit;font-size:13px;padding:6px 14px;cursor:pointer;white-space:nowrap\"\u003e{{ demo2Label }}\u003c/button\u003e\n        \u003c/div\u003e\n\u003cdatalist id=\"sb-titles\"\u003e\u003csc-for list=\"{{ allTitles }}\" as=\"t\" hint-placeholder-count=\"3\"\u003e\u003coption value=\"{{ t }}\"\u003e\u003c/option\u003e\u003c/sc-for\u003e\u003c/datalist\u003e\n\u003csc-if value=\"{{ hasErr }}\" hint-placeholder-val=\"{{ false }}\"\u003e\u003cp style=\"margin:10px 0 0;font-size:13px;color:#e05a4a\"\u003e{{ err }}\u003c/p\u003e\u003c/sc-if\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"position:relative;height:440px;perspective:1400px;transform-style:preserve-3d;pointer-events:none\"\u003e{{ heroGlobe }}\u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003c!-- RESULTS --\u003e\n    \u003csc-if value=\"{{ hasResults }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n    \u003csection id=\"results\" data-screen-label=\"Results\" style=\"display:flex;flex-direction:column;gap:18px;animation:sbin .6s cubic-bezier(.22,1,.36,1) backwards\"\u003e\n      \u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap\"\u003e\n        \u003cdiv style=\"max-width:680px\"\u003e\n          \u003cp style=\"margin:0 0 6px;font-size:12px;color:#6f7a74;letter-spacing:.06em\"\u003e{{ originLine }}\u003c/p\u003e\n          \u003ch2 style=\"margin:0;font-size:26px;font-weight:500;line-height:1.25;text-wrap:pretty\"\u003e{{ verdict }}\u003c/h2\u003e\n          \u003cp style=\"margin:8px 0 0;color:#8a948e;font-size:13px\"\u003e{{ verdictSub }} \u00b7 \u003cbutton sc-camel-on-click=\"{{ toggleWhy }}\" style=\"background:none;border:none;padding:0;color:#e8ece9;border-bottom:1px dashed #6f7a74;font:inherit;font-size:13px;cursor:pointer\"\u003e{{ whyLabel }}\u003c/button\u003e \u00b7 Data updated {{ dataUpdated }}\u003c/p\u003e\n          \u003csc-if value=\"{{ whyOpen }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n          \u003cdiv style=\"margin-top:10px;background:#141917;border:1px solid #232826;border-radius:12px;padding:12px 14px;font-size:13px;color:#8a948e;display:flex;flex-direction:column;gap:6px;animation:sbin .3s ease backwards\"\u003e\n            \u003csc-for list=\"{{ whyLines }}\" as=\"w\" hint-placeholder-count=\"3\"\u003e\u003cdiv style=\"display:flex;gap:10px;align-items:baseline\"\u003e\u003cspan style=\"color:{{ accent }};font-weight:500;min-width:90px;font-variant-numeric:tabular-nums\"\u003e{{ w.k }}\u003c/span\u003e\u003cspan\u003e{{ w.v }}\u003c/span\u003e\u003c/div\u003e\u003c/sc-for\u003e\n          \u003c/div\u003e\n          \u003c/sc-if\u003e\n        \u003c/div\u003e\n        \u003csc-if value=\"{{ hasMoves }}\" hint-placeholder-val=\"{{ true }}\"\u003e\n        \u003cdiv style=\"display:flex;flex-direction:column;gap:8px;align-items:flex-end\"\u003e\n          \u003clabel style=\"display:flex;gap:8px;align-items:center;font-size:12px;color:#8a948e\"\u003eWages for\n            \u003cspan style=\"color:#e8ece9;font-size:12px\"\u003eUnited States (national)\u003c/span\u003e \u003cspan style=\"color:#6f7a74;font-size:12px\"\u003emetro view planned \u2014 needs the full OEWS metro file\u003c/span\u003e\n          \u003c/label\u003e\n          \u003cdiv style=\"display:flex;gap:4px;background:#141917;border:1px solid #232826;border-radius:10px;padding:4px\"\u003e\n            \u003cbutton sc-camel-on-click=\"{{ set3d }}\" style=\"{{ tab3d }}\"\u003e3D map\u003c/button\u003e\n            \u003cbutton sc-camel-on-click=\"{{ setFlat }}\" style=\"{{ tabFlat }}\"\u003eFlat chart\u003c/button\u003e\n            \u003cbutton sc-camel-on-click=\"{{ setList }}\" style=\"{{ tabList }}\"\u003eList\u003c/button\u003e\n          \u003c/div\u003e\n          \u003cspan style=\"font-size:11px;color:#6f7a74;white-space:nowrap\"\u003eYour last view is remembered\u003c/span\u003e\n        \u003c/div\u003e\n        \u003c/sc-if\u003e\n      \u003c/div\u003e\n\n      \u003csc-if value=\"{{ hasMoves }}\" hint-placeholder-val=\"{{ true }}\"\u003e\n      \u003cdiv style=\"background:#141917;border:1px solid #232826;border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:12px 24px;align-items:center\"\u003e\n        \u003cdiv\u003e\u003cp style=\"margin:0;font-size:13px;font-weight:500\"\u003eWhat matters most to you?\u003c/p\u003e\u003cp style=\"margin:2px 0 0;font-size:12px;color:#8a948e;max-width:200px\"\u003eThe map doesn't change \u2014 the recommendation does.\u003c/p\u003e\u003c/div\u003e\n        \u003clabel style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#8a948e\"\u003e\u003cspan style=\"display:flex;justify-content:space-between\"\u003e\u003cspan\u003ePay gain\u003c/span\u003e\u003cspan style=\"color:#e8ece9\"\u003e{{ wPayLabel }}\u003c/span\u003e\u003c/span\u003e\u003cinput type=\"range\" min=\"0\" max=\"2\" step=\"0.25\" value=\"{{ wPay }}\" sc-camel-on-change=\"{{ setWPay }}\" style=\"accent-color:{{ accent }};width:100%\"\u003e\u003c/label\u003e\n        \u003clabel style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#8a948e\"\u003e\u003cspan style=\"display:flex;justify-content:space-between\"\u003e\u003cspan\u003eSpeed (less retraining)\u003c/span\u003e\u003cspan style=\"color:#e8ece9\"\u003e{{ wSpeedLabel }}\u003c/span\u003e\u003c/span\u003e\u003cinput type=\"range\" min=\"0\" max=\"2\" step=\"0.25\" value=\"{{ wSpeed }}\" sc-camel-on-change=\"{{ setWSpeed }}\" style=\"accent-color:{{ accent }};width:100%\"\u003e\u003c/label\u003e\n        \u003clabel style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#8a948e\"\u003e\u003cspan style=\"display:flex;justify-content:space-between\"\u003e\u003cspan\u003eAI safety\u003c/span\u003e\u003cspan style=\"color:#e8ece9\"\u003e{{ wSafeLabel }}\u003c/span\u003e\u003c/span\u003e\u003cinput type=\"range\" min=\"0\" max=\"2\" step=\"0.25\" value=\"{{ wSafe }}\" sc-camel-on-change=\"{{ setWSafe }}\" style=\"accent-color:{{ accent }};width:100%\"\u003e\u003c/label\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px\"\u003e\n        \u003cdiv style=\"background:#141917;border:1px solid #232826;border-radius:14px;padding:16px;position:relative;overflow:hidden;display:flex;flex-direction:column;height:560px;align-self:start\"\u003e\n          \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\"\u003e\n            \u003cp style=\"margin:0;color:#8a948e;font-size:13px;white-space:nowrap\"\u003eMap of your realistic moves\u003c/p\u003e\n            \u003cspan style=\"font-size:11px;color:#6f7a74;border:1px solid #232826;border-radius:999px;padding:3px 10px;white-space:nowrap\"\u003e{{ mapHint }}\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv style=\"display:flex;gap:16px;margin-top:8px;font-size:12px;color:#8a948e;flex-wrap:wrap\"\u003e\n            \u003cspan style=\"display:flex;gap:6px;align-items:center\"\u003e\u003cspan style=\"width:4px;height:14px;background:{{ accent }};border-radius:2px\"\u003e\u003c/span\u003etaller = more pay\u003c/span\u003e\n            \u003cspan style=\"display:flex;gap:6px;align-items:center\"\u003e\u003cspan style=\"width:14px;height:1px;background:#6f7a74\"\u003e\u003c/span\u003ecloser to you = less to learn\u003c/span\u003e\n            \u003cspan style=\"display:flex;gap:6px;align-items:center\"\u003e\u003cspan style=\"width:8px;height:8px;border-radius:50%;background:{{ accent }}\"\u003e\u003c/span\u003ecolored = no better trade-off exists\u003c/span\u003e\n          \u003c/div\u003e\n          \u003csc-if value=\"{{ is3d }}\" hint-placeholder-val=\"{{ true }}\"\u003e\u003cdiv style=\"flex:1;position:relative;perspective:1600px;transform-style:preserve-3d\"\u003e{{ frontierScene }}\u003c/div\u003e\n          \u003csc-if value=\"{{ tourOn }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n          \u003cdiv style=\"position:absolute;left:16px;right:16px;bottom:40px;background:rgba(24,29,27,.92);border:1px solid #2b332f;border-radius:12px;padding:12px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:sbin .4s ease backwards;backdrop-filter:blur(8px)\"\u003e\n            \u003cspan style=\"flex:none;width:26px;height:26px;border-radius:50%;background:{{ accent }};color:#0b241a;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center\"\u003e{{ tourNum }}\u003c/span\u003e\n            \u003cdiv style=\"flex:1;min-width:0\"\u003e\u003cp style=\"margin:0;font-size:13px;font-weight:500\"\u003e{{ tourTitle }}\u003c/p\u003e\u003cp style=\"margin:2px 0 0;font-size:12px;color:#8a948e\"\u003e{{ tourText }}\u003c/p\u003e\u003c/div\u003e\n            \u003cbutton sc-camel-on-click=\"{{ tourSkip }}\" style=\"background:none;border:none;color:#8a948e;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap\"\u003eSkip tour\u003c/button\u003e\n            \u003cbutton sc-camel-on-click=\"{{ tourNext }}\" style=\"background:{{ accent }};color:#0b241a;border:none;border-radius:8px;padding:8px 14px;font:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap\"\u003e{{ tourNextLabel }}\u003c/button\u003e\n          \u003c/div\u003e\n          \u003c/sc-if\u003e\u003c/sc-if\u003e\n          \u003csc-if value=\"{{ isFlat }}\" hint-placeholder-val=\"{{ false }}\"\u003e\u003cdiv style=\"flex:1;position:relative\"\u003e{{ flatChart }}\u003c/div\u003e\u003c/sc-if\u003e\n          \u003csc-if value=\"{{ isList }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n            \u003cdiv style=\"flex:1;display:flex;flex-direction:column;gap:6px;margin-top:12px;overflow:auto\"\u003e\n              \u003csc-for list=\"{{ moves }}\" as=\"m\" hint-placeholder-count=\"5\"\u003e\n                \u003cbutton sc-camel-on-click=\"{{ m.open }}\" style=\"display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;text-align:left;background:#181d1b;border:1px solid #232826;border-radius:10px;padding:10px 12px;color:#e8ece9;font:inherit;cursor:pointer;min-height:44px\"\u003e\n                  \u003cspan\u003e\u003cspan style=\"font-weight:500\"\u003e{{ m.title }}\u003c/span\u003e\u003cspan style=\"display:block;color:#8a948e;font-size:12px\"\u003e{{ m.meta }}\u003c/span\u003e\u003c/span\u003e\n                  \u003cspan style=\"color:{{ accent }};font-weight:500;font-variant-numeric:tabular-nums\"\u003e{{ m.pay }}\u003c/span\u003e\n                  \u003cspan style=\"color:#6f7a74;font-size:12px\"\u003e{{ m.ai }}\u003c/span\u003e\n                \u003c/button\u003e\n              \u003c/sc-for\u003e\n            \u003c/div\u003e\n          \u003c/sc-if\u003e\n          \u003cdiv style=\"display:flex;gap:16px;font-size:12px;color:#6f7a74;margin-top:6px\"\u003e\u003cspan\u003e\u2190 Less retraining\u003c/span\u003e\u003cspan style=\"margin-left:auto\"\u003eMore retraining \u2192\u003c/span\u003e\u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv style=\"display:flex;flex-direction:column;gap:12px\"\u003e\n          \u003cdiv style=\"background:#141917;border:1px solid {{ accent }};border-radius:14px;padding:14px 16px;box-shadow:0 18px 40px rgba(0,0,0,.35)\"\u003e\n            \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center\"\u003e\u003cp style=\"margin:0;color:#8a948e;font-size:12px\"\u003eRecommended for you\u003c/p\u003e\u003cspan style=\"font-size:11px;color:#0b241a;background:{{ accent }};border-radius:999px;padding:1px 8px;font-weight:500;white-space:nowrap\"\u003eBest fit for your priorities\u003c/span\u003e\u003c/div\u003e\n            \u003cp style=\"margin:4px 0 0;font-size:17px;font-weight:500\"\u003e{{ best.title }}\u003c/p\u003e\n            \u003cdiv style=\"display:flex;gap:14px;margin-top:6px;font-size:12px;color:#8a948e;flex-wrap:wrap;align-items:flex-end\"\u003e\n              \u003cspan\u003e\u003cspan style=\"color:{{ accent }};font-size:20px;font-weight:500;font-variant-numeric:tabular-nums\"\u003e{{ best.pay }}\u003c/span\u003e/yr\u003c/span\u003e\u003cspan\u003e{{ best.time }}\u003c/span\u003e\u003cspan\u003e{{ best.openings }}\u003c/span\u003e\n            \u003c/div\u003e\n            \u003cdiv style=\"margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:#8a948e\"\u003e\n              \u003cdiv style=\"display:flex;justify-content:space-between\"\u003e\u003cspan\u003eAI exposure after move\u003c/span\u003e\u003cspan style=\"color:#e8ece9;font-variant-numeric:tabular-nums\"\u003e{{ best.rangeText }}\u003c/span\u003e\u003c/div\u003e\n              \u003cdiv style=\"position:relative;height:6px;background:#232826;border-radius:3px\"\u003e\u003cdiv style=\"position:absolute;top:0;bottom:0;left:{{ best.rLo }};width:{{ best.rW }};background:{{ accent }};border-radius:3px;opacity:.9\"\u003e\u003c/div\u003e\u003cdiv style=\"position:absolute;top:-2px;bottom:-2px;left:{{ origMidPct }};width:2px;background:#e8ece9\"\u003e\u003c/div\u003e\u003c/div\u003e\n              \u003cdiv style=\"display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap\"\u003e\u003cspan style=\"white-space:nowrap\"\u003e{{ best.agreeText }}\u003c/span\u003e\u003cspan style=\"white-space:nowrap\"\u003e\u2502 = you today\u003c/span\u003e\u003c/div\u003e\n            \u003c/div\u003e\n            \u003cp style=\"margin:8px 0 0;font-size:12px;color:#8a948e;display:flex;gap:6px;align-items:center\"\u003e\u003cspan style=\"{{ best.popStyle }}\"\u003e{{ best.popTag }}\u003c/span\u003e{{ best.popText }}\u003c/p\u003e\n            \u003cdiv style=\"display:flex;gap:8px;margin-top:10px;flex-wrap:wrap\"\u003e\n              \u003cbutton sc-camel-on-click=\"{{ best.open }}\" style=\"background:{{ accent }};color:#0b241a;font:inherit;font-size:12px;font-weight:500;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap\"\u003eSkill checklist\u003c/button\u003e\n              \u003cbutton sc-camel-on-click=\"{{ best.compare }}\" style=\"background:none;border:1px solid #2b332f;font:inherit;font-size:12px;border-radius:8px;padding:8px 12px;color:#e8ece9;cursor:pointer;white-space:nowrap\"\u003e{{ best.compareLabel }}\u003c/button\u003e\n              \u003cbutton sc-camel-on-click=\"{{ best.save }}\" style=\"background:none;border:1px solid #2b332f;font:inherit;font-size:12px;border-radius:8px;padding:8px 10px;color:#8a948e;cursor:pointer;white-space:nowrap\"\u003e{{ best.saveLabel }}\u003c/button\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv style=\"background:#141917;border:1px solid #232826;border-radius:14px;padding:14px 16px\"\u003e\n            \u003cp style=\"margin:0;color:#8a948e;font-size:12px\"\u003eClosest win\u003c/p\u003e\n            \u003cp style=\"margin:4px 0 0;font-size:17px;font-weight:500\"\u003e{{ close.title }}\u003c/p\u003e\n            \u003cdiv style=\"display:flex;gap:14px;margin-top:6px;font-size:12px;color:#8a948e;flex-wrap:wrap;align-items:flex-end\"\u003e\n              \u003cspan\u003e\u003cspan style=\"color:{{ accent }};font-size:20px;font-weight:500;font-variant-numeric:tabular-nums\"\u003e{{ close.pay }}\u003c/span\u003e/yr\u003c/span\u003e\u003cspan\u003e{{ close.time }}\u003c/span\u003e\u003cspan\u003e{{ close.openings }}\u003c/span\u003e\n            \u003c/div\u003e\n            \u003cdiv style=\"margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:#8a948e\"\u003e\n              \u003cdiv style=\"display:flex;justify-content:space-between\"\u003e\u003cspan\u003eAI exposure after move\u003c/span\u003e\u003cspan style=\"color:#e8ece9;font-variant-numeric:tabular-nums\"\u003e{{ close.rangeText }}\u003c/span\u003e\u003c/div\u003e\n              \u003cdiv style=\"position:relative;height:6px;background:#232826;border-radius:3px\"\u003e\u003cdiv style=\"position:absolute;top:0;bottom:0;left:{{ close.rLo }};width:{{ close.rW }};background:#8a948e;border-radius:3px\"\u003e\u003c/div\u003e\u003cdiv style=\"position:absolute;top:-2px;bottom:-2px;left:{{ origMidPct }};width:2px;background:#e8ece9\"\u003e\u003c/div\u003e\u003c/div\u003e\n              \u003cdiv style=\"display:flex;justify-content:space-between\"\u003e\u003cspan style=\"color:{{ close.agreeColor }}\"\u003e{{ close.agreeText }}\u003c/span\u003e\u003c/div\u003e\n            \u003c/div\u003e\n            \u003cp style=\"margin:8px 0 0;font-size:12px;color:#8a948e;display:flex;gap:6px;align-items:center\"\u003e\u003cspan style=\"{{ close.popStyle }}\"\u003e{{ close.popTag }}\u003c/span\u003e{{ close.popText }}\u003c/p\u003e\n            \u003cdiv style=\"display:flex;gap:8px;margin-top:10px;flex-wrap:wrap\"\u003e\n              \u003cbutton sc-camel-on-click=\"{{ close.open }}\" style=\"background:none;border:1px solid #2b332f;font:inherit;font-size:12px;border-radius:8px;padding:8px 12px;color:#e8ece9;cursor:pointer;white-space:nowrap\"\u003eSkill checklist\u003c/button\u003e\n              \u003cbutton sc-camel-on-click=\"{{ close.compare }}\" style=\"background:none;border:1px solid #2b332f;font:inherit;font-size:12px;border-radius:8px;padding:8px 12px;color:#e8ece9;cursor:pointer;white-space:nowrap\"\u003e{{ close.compareLabel }}\u003c/button\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv style=\"background:#141917;border:1px solid #232826;border-radius:14px;padding:14px 16px;flex:1\"\u003e\n            \u003cp style=\"margin:0 0 4px;color:#8a948e;font-size:13px\"\u003eYour AI exposure today\u003c/p\u003e\n            \u003cp style=\"margin:0 0 10px;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums\"\u003e{{ origRange }} \u003cspan style=\"font-size:12px;color:#8a948e;font-weight:400\"\u003epercentile \u2014 a range, because sources disagree\u003c/span\u003e\u003c/p\u003e\n            \u003cdiv style=\"position:relative;height:10px;background:#232826;border-radius:5px;margin:0 0 6px\"\u003e\u003cdiv style=\"position:absolute;top:0;bottom:0;left:{{ origLo }};width:{{ origW }};background:linear-gradient(90deg,#4a5a52,#e0b34a);border-radius:5px\"\u003e\u003c/div\u003e\u003c/div\u003e\n            \u003cdiv style=\"display:flex;justify-content:space-between;font-size:11px;color:#6f7a74;margin-bottom:10px\"\u003e\u003cspan\u003e0 \u00b7 low exposure\u003c/span\u003e\u003cspan\u003e100 \u00b7 high\u003c/span\u003e\u003c/div\u003e\n            \u003cdiv style=\"display:flex;flex-direction:column;gap:4px;font-size:12px;color:#8a948e\"\u003e\n              \u003csc-for list=\"{{ srcRows }}\" as=\"s\" hint-placeholder-count=\"3\"\u003e\u003cdiv style=\"display:flex;justify-content:space-between\"\u003e\u003cspan\u003e{{ s.name }}\u003c/span\u003e\u003cspan style=\"color:#e8ece9\"\u003e{{ s.pct }}\u003c/span\u003e\u003c/div\u003e\u003c/sc-for\u003e\n            \u003c/div\u003e\n            \u003cp style=\"margin:10px 0 0;font-size:12px;color:#8a948e\"\u003e{{ spreadNote }}\u003c/p\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003c/sc-if\u003e\n\n      \u003csc-if value=\"{{ noMoves }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n      \u003cdiv style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center\"\u003e\n        \u003cdiv style=\"height:260px;position:relative;perspective:900px;transform-style:preserve-3d\"\u003e{{ summitScene }}\u003c/div\u003e\n        \u003cdiv style=\"background:#141917;border:1px solid #232826;border-radius:14px;padding:16px\"\u003e\n          \u003cp style=\"margin:0 0 8px;color:#8a948e;font-size:12px\"\u003eWhat people in your position do instead\u003c/p\u003e\n          \u003cdiv style=\"display:flex;flex-direction:column;font-size:13px\"\u003e\n            \u003csc-for list=\"{{ altRows }}\" as=\"r\" hint-placeholder-count=\"2\"\u003e\u003cdiv style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #232826\"\u003e\u003cspan\u003e{{ r.label }}\u003cbr\u003e\u003cspan style=\"color:#8a948e;font-size:12px\"\u003e{{ r.title }}\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"color:{{ accent }};font-size:12px;align-self:center;flex:none\"\u003e{{ r.note }}\u003c/span\u003e\u003c/div\u003e\u003c/sc-for\u003e\n            \u003cdiv style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 0\"\u003e\u003cspan\u003eWatch this data\u003cbr\u003e\u003cspan style=\"color:#8a948e;font-size:12px\"\u003eExposure indices refresh with each data release\u003c/span\u003e\u003c/span\u003e\u003ca href=\"https://github.com/SAMYSOSERIOUS/skillbridge\" target=\"_blank\" rel=\"noopener\" style=\"border:1px solid #2b332f;background:none;color:#e8ece9;border-radius:8px;padding:6px 12px;font:inherit;font-size:12px;align-self:center;cursor:pointer;text-decoration:none\"\u003eWatch repo\u003c/a\u003e\u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003c/sc-if\u003e\n    \u003c/section\u003e\n\n    \u003c!-- ROUTES --\u003e\n    \u003csc-if value=\"{{ hasMoves }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n    \u003csection id=\"routes\" data-screen-label=\"Routes\" style=\"background:#141917;border:1px solid #232826;border-radius:14px;padding:16px\"\u003e\n      \u003cp style=\"margin:0 0 4px;font-size:16px;font-weight:500\"\u003eEscape routes\u003c/p\u003e\n      \u003cp style=\"margin:0 0 12px;color:#8a948e;font-size:13px\"\u003eMulti-step ladders when one jump isn't enough.\u003c/p\u003e\n      \u003csc-for list=\"{{ routes }}\" as=\"r\" hint-placeholder-count=\"2\"\u003e\n        \u003cdiv style=\"display:flex;align-items:center;gap:10px 8px;flex-wrap:wrap;font-size:13px;padding:10px 0;border-top:1px solid #232826\"\u003e\n          \u003csc-for list=\"{{ r.hops }}\" as=\"hp\" hint-placeholder-count=\"3\"\u003e\n            \u003cspan style=\"{{ hp.style }}\"\u003e{{ hp.title }}\u003c/span\u003e\u003cspan style=\"{{ hp.arrowStyle }}\"\u003e\u2192\u003c/span\u003e\n          \u003c/sc-for\u003e\n          \u003cspan style=\"margin-left:auto;color:{{ accent }};font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap\"\u003e{{ r.gain }}\u003c/span\u003e\n        \u003c/div\u003e\n      \u003c/sc-for\u003e\n    \u003c/section\u003e\n    \u003c/sc-if\u003e\n    \u003c/sc-if\u003e\n\n    \u003c!-- METHODOLOGY --\u003e\n    \u003csection id=\"methodology\" data-screen-label=\"How it works\" style=\"display:flex;flex-direction:column;gap:14px\"\u003e\n      \u003ch2 style=\"margin:0;font-size:20px;font-weight:500\"\u003eHow this works\u003c/h2\u003e\n      \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;color:#8a948e;font-size:13px\"\u003e\n        \u003cdiv\u003e\u003ch3 style=\"margin:0 0 6px;font-size:14px;font-weight:500;color:#e8ece9\"\u003eThe frontier\u003c/h3\u003e\u003cp style=\"margin:0\"\u003eEvery move is scored on pay gain, retraining effort, and AI-risk change at once. A highlighted move is one where you can't do better on one count without giving up another.\u003c/p\u003e\u003c/div\u003e\n        \u003cdiv\u003e\u003ch3 style=\"margin:0 0 6px;font-size:14px;font-weight:500;color:#e8ece9\"\u003eRetraining effort\u003c/h3\u003e\u003cp style=\"margin:0\"\u003eSkill-profile distance, how far you must level up, education-zone jumps (max one), and task similarity across 19,000 O*NET task statements.\u003c/p\u003e\u003c/div\u003e\n        \u003cdiv\u003e\u003ch3 style=\"margin:0 0 6px;font-size:14px;font-weight:500;color:#e8ece9\"\u003eYour priorities &amp; proof\u003c/h3\u003e\u003cp style=\"margin:0\"\u003eThe frontier is fixed; your sliders only pick which frontier move is recommended. \"Big field\" and \"Smaller field\" reflect real national employment in each occupation (BLS OEWS) \u2014 how many people hold the job, not how often people switch into it. True mobility-flow data is a planned addition.\u003c/p\u003e\u003c/div\u003e\n        \u003cdiv\u003e\u003ch3 style=\"margin:0 0 6px;font-size:14px;font-weight:500;color:#e8ece9\"\u003eAI risk, honestly\u003c/h3\u003e\u003cp style=\"margin:0\"\u003eThree independent indices (AIOE, OpenAI, Microsoft Research) shown as percentiles, with a flag when they disagree. Disagreement is information, not noise.\u003c/p\u003e\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection id=\"data\" data-screen-label=\"Data\" style=\"display:flex;flex-direction:column;gap:10px;color:#8a948e;font-size:13px;padding-bottom:40px\"\u003e\n      \u003ch2 style=\"margin:0;font-size:20px;font-weight:500;color:#e8ece9\"\u003eData &amp; limitations\u003c/h2\u003e\n      \u003cp style=\"margin:0;max-width:760px\"\u003eO*NET skills, Job Zones, tasks &amp; technology skills (USDOL/ETA, CC BY 4.0) \u00b7 BLS OEWS median wages &amp; education/training assignments \u00b7 AIOE (Felten, Raj &amp; Seamans) \u00b7 \"GPTs are GPTs\" (OpenAI) \u00b7 \"Working with AI\" (Microsoft Research). Profiles describe the typical job holder, not you; exposure is not certain job loss. A \"\u2265\" wage means the government caps published medians at $208,000 \u2014 the real figure is at least that. Analysis of public data \u2014 not career advice.\u003c/p\u003e\n      \u003cp style=\"margin:0;max-width:760px\"\u003e\u003cspan style=\"color:#e8ece9\"\u003eUS edition.\u003c/span\u003e All datasets share the US O*NET-SOC / OEWS occupation codes, so every number is comparable. An EU edition (ESCO taxonomy) is planned \u2014 mixing the two taxonomies would break that consistency, so we don't.\u003c/p\u003e\n    \u003c/section\u003e\n  \u003c/main\u003e\n\n  \u003c!-- COMPARE TRAY --\u003e\n  \u003csc-if value=\"{{ hasCompare }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n  \u003cdiv style=\"position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(1032px,calc(100% - 48px));z-index:30;background:#181d1b;border:1px solid #2b332f;border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 -20px 60px rgba(0,0,0,.6);animation:sbin .4s cubic-bezier(.22,1,.36,1) backwards\"\u003e\n    \u003cdiv style=\"flex:none\"\u003e\u003cp style=\"margin:0;font-size:12px;color:#8a948e\"\u003eComparing\u003c/p\u003e\u003cp style=\"margin:0;font-size:13px;font-weight:500\"\u003e{{ compareCount }}\u003c/p\u003e\u003c/div\u003e\n    \u003csc-for list=\"{{ compareItems }}\" as=\"c\" hint-placeholder-count=\"2\"\u003e\n      \u003cdiv style=\"flex:1;min-width:0;border-left:1px solid #232826;padding-left:12px\"\u003e\u003cp style=\"margin:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\"\u003e{{ c.title }}\u003c/p\u003e\u003cp style=\"margin:0;font-size:12px;color:#8a948e\"\u003e\u003cspan style=\"color:{{ accent }}\"\u003e{{ c.pay }}\u003c/span\u003e \u00b7 {{ c.time }} \u00b7 {{ c.ai }}\u003c/p\u003e\u003c/div\u003e\n    \u003c/sc-for\u003e\n    \u003cbutton sc-camel-on-click=\"{{ clearCompare }}\" style=\"background:none;border:none;color:#8a948e;font-size:18px;cursor:pointer;flex:none\"\u003e\u00d7\u003c/button\u003e\n  \u003c/div\u003e\n  \u003c/sc-if\u003e\n\n  \u003c!-- SKILL PLAN DRAWER --\u003e\n  \u003csc-if value=\"{{ drawerOpen }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n  \u003cdiv sc-camel-on-click=\"{{ closeDrawer }}\" style=\"position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40\"\u003e\u003c/div\u003e\n  \u003caside data-screen-label=\"Skill plan\" style=\"position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:#141917;border-left:1px solid #2b332f;padding:26px 28px;overflow-y:auto;z-index:50;box-shadow:-30px 0 80px rgba(0,0,0,.6);animation:sbslide .35s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;gap:14px;box-sizing:border-box\"\u003e\n    \u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-start\"\u003e\n -between\"\u003e\u003cspan\u003eMust learn \u2014 start here\u003c/span\u003e\u003cspan\u003e{{ drawer.acquireCount }}\u003c/span\u003e\u003c/p\u003e\n    \u003csc-for list=\"{{ drawer.acquire }}\" as=\"s\" hint-placeholder-count=\"2\"\u003e\n      \u003cdiv style=\"background:#181d1b;border:1px solid #232826;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center\"\u003e\n        \u003cspan style=\"font-size:13px\"\u003e{{ s.skill }} \u003cspan style=\"color:#6f7a74;font-size:12px\"\u003e{{ s.levels }}\u003c/span\u003e\u003c/span\u003e\n        \u003ca href=\"#methodology\" style=\"font-size:12px;color:{{ accent }}\"\u003e{{ s.how }} \u2192\u003c/a\u003e\n        \u003cdiv style=\"grid-column:1/-1;height:4px;background:#232826;border-radius:2px\"\u003e\u003cdiv style=\"height:100%;width:{{ s.w }};background:#e05a4a;border-radius:2px\"\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/sc-for\u003e\n    \u003cp style=\"margin:4px 0 0;font-size:12px;color:#e0b34a;display:flex;justify-content:space-between\"\u003e\u003cspan\u003eNeeds upgrading \u2014 on the job\u003c/span\u003e\u003cspan\u003e{{ drawer.upgradeCount }}\u003c/span\u003e\u003c/p\u003e\n    \u003cdiv style=\"display:flex;gap:6px;flex-wrap:wrap\"\u003e\n      \u003csc-for list=\"{{ drawer.upgrade }}\" as=\"u\" hint-placeholder-count=\"3\"\u003e\u003cspan style=\"border:1px solid #2b332f;border-radius:999px;padding:3px 10px;font-size:12px\"\u003e{{ u }}\u003c/span\u003e\u003c/sc-for\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"background:#181d1b;border:1px solid #232826;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px\"\u003e\n      \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"\u003e\u003cp style=\"margin:0;font-size:12px;color:#8a948e\"\u003e{{ drawer.have }}\u003c/p\u003e\u003cbutton sc-camel-on-click=\"{{ drawer.copySkills }}\" style=\"flex:none;background:none;border:1px solid #2b332f;color:#e8ece9;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap\"\u003e{{ copyLabel }}\u003c/button\u003e\u003c/div\u003e\n      \u003cp style=\"margin:0;font-size:11px;color:#6f7a74\"\u003eRecruiters search by these exact skill names \u2014 make sure they're on your resume and profile.\u003c/p\u003e\n    \u003c/div\u003e\n    \u003csc-if value=\"{{ drawer.hasTech }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n      \u003cdiv style=\"background:#181d1b;border:1px solid #232826;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px\"\u003e\n        \u003cp style=\"margin:0 0 6px;font-size:12px;color:#e8ece9;font-weight:500\"\u003eTools employers expect \u003cspan style=\"color:#6f7a74;font-weight:400\"\u003e\u00b7 from O*NET job postings data\u003c/span\u003e\u003c/p\u003e\n        \u003csc-for list=\"{{ drawer.techRows }}\" as=\"t\" hint-placeholder-count=\"3\"\u003e\n          \u003cdiv style=\"display:flex;align-items:center;gap:10px;min-height:36px;border-top:1px solid #20262390\"\u003e\n            \u003cspan style=\"font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\"\u003e\u003cspan style=\"{{ t.hotDot }}\" title=\"{{ t.hotTitle }}\"\u003e\u003c/span\u003e{{ t.name }}\u003c/span\u003e\n            \u003ca href=\"{{ t.href }}\" target=\"_blank\" rel=\"noopener\" style=\"{{ t.linkStyle }};margin-left:auto\"\u003e{{ t.linkLabel }}\u003c/a\u003e\n          \u003c/div\u003e\n        \u003c/sc-for\u003e\n        \u003cp style=\"margin:8px 0 0;font-size:11px;color:#6f7a74\"\u003e\u003cspan style=\"display:inline-block;width:6px;height:6px;border-radius:50%;background:{{ accent }};margin-right:6px;vertical-align:2px\"\u003e\u003c/span\u003e= often required in job ads. Orange links go to the vendor's official certification page; grey links open a course search. Nothing here is invented.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/sc-if\u003e\n    \u003cp style=\"margin:6px 0 0;font-size:12px;color:#8a948e;display:flex;justify-content:space-between\"\u003e\u003cspan style=\"color:#e8ece9;font-weight:500\"\u003eYour plan, with dates\u003c/span\u003e\u003cspan\u003e{{ drawer.planDone }}\u003c/span\u003e\u003c/p\u003e\n    \u003csc-for list=\"{{ drawer.milestones }}\" as=\"ms\" hint-placeholder-count=\"3\"\u003e\n      \u003clabel style=\"display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:13px;min-height:44px\"\u003e\n        \u003cinput type=\"checkbox\" checked=\"{{ ms.done }}\" sc-camel-on-change=\"{{ ms.toggle }}\" style=\"width:16px;height:16px;accent-color:{{ accent }}\"\u003e\n        \u003cspan style=\"{{ ms.style }}\"\u003e{{ ms.title }}\u003c/span\u003e\n        \u003cinput type=\"month\" value=\"{{ ms.date }}\" sc-camel-on-change=\"{{ ms.setDate }}\" style=\"background:#181d1b;border:1px solid #2b332f;border-radius:8px;color:#e8ece9;font:inherit;font-size:12px;padding:6px 8px;color-scheme:dark\"\u003e\n      \u003c/label\u003e\n    \u003c/sc-for\u003e\n    \u003cdiv style=\"margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap\"\u003e\n      \u003cbutton sc-camel-on-click=\"{{ drawer.save }}\" style=\"background:{{ accent }};color:#0b241a;font:inherit;font-weight:500;border:none;border-radius:10px;padding:10px 16px;font-size:13px;cursor:pointer;white-space:nowrap\"\u003e{{ drawer.saveLabel }}\u003c/button\u003e\n      \u003ca href=\"{{ drawer.claudeHref }}\" target=\"_blank\" rel=\"noopener\" style=\"background:none;color:{{ accent }};border:1px solid {{ accent }}66;border-radius:10px;padding:10px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;text-align:center\"\u003e\u2726 Explain my plan with Claude\u003c/a\u003e\n      \u003ca href=\"{{ drawer.mailto }}\" style=\"background:none;color:#e8ece9;border:1px solid #2b332f;border-radius:10px;padding:10px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;text-align:center\"\u003eEmail card\u003c/a\u003e\n      \u003cbutton sc-camel-on-click=\"{{ drawer.compare }}\" style=\"background:none;color:#e8ece9;border:1px solid #2b332f;border-radius:10px;padding:10px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap\"\u003eCompare\u003c/button\u003e\n      \u003cspan style=\"margin-left:auto;color:#6f7a74;font-size:11px\"\u003ePublic data \u00b7 not career advice\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/aside\u003e\n  \u003c/sc-if\u003e\n\u003c/div\u003e\n\u003c/x-dc\u003e\n\u003cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;autoOrbit&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;3D motion&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:60,&quot;min&quot;:20,&quot;max&quot;:140,&quot;step&quot;:10,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;3D motion&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ff7a59&quot;,&quot;options&quot;:[&quot;#ff7a59&quot;,&quot;#2ee08a&quot;,&quot;#5ad0ff&quot;,&quot;#e0b34a&quot;],&quot;tsType&quot;:&quot;string&quot;}}\"\u003e\nclass Component extends DCLogic {\n  constructor(p){ super(p);\n    const ls=(k,d)=\u003e{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){ return d; } };\n    this.rm=typeof matchMedia!=='undefined'&&matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this.state={ang:0,drag:null,hover:false,hoverAng:0,tourAng:0,tour:-1,query:'',origin:null,bundle:null,db:null,err:'',mode:ls('sb.view','3d'),w:ls('sb.w',{pay:1,speed:1,safe:1}),plans:ls('sb.plans',{}),drawer:null,compare:[],saved:[],why:false,copied:false};\n    this._bomCache={}; this._oCache=null; this._oKey=null; }\n  componentDidMount(){ const t=()=\u003e{ const S=this.state;\n      if(S.tour\u003e=0&&!this.rm){ const tgt=this.tourTarget; if(tgt!=null) this.setState(s=\u003e({tourAng:s.tourAng+(tgt-s.tourAng)*0.06})); }\n      else if(!S.drag&&!S.hover&&!this.rm&&(this.props.autoOrbit??true)) this.setState(s=\u003e({ang:s.ang+0.25}));\n      this.raf=requestAnimationFrame(t); }; this.raf=requestAnimationFrame(t);\n    // Real data: everything below was precomputed by the pipeline\n    // (DuckDB/dbt warehouse -\u003e engine -\u003e JSON export). Nothing is invented here.\n    const j=p=\u003efetch('./data/'+p).then(r=\u003e{ if(!r.ok) throw new Error('data'); return r.json(); });\n    Promise.all([j('occupations.json'),j('config.json'),j('skills.json')])\n      .then(([occs,cfg,skills])=\u003ethis.setState({db:{occs,cfg,skills}}))\n      .catch(()=\u003ethis.setState({err:'Could not load the dataset. Refresh to retry.'})); }\n  componentWillUnmount(){ cancelAnimationFrame(this.raf); }\n  persist(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }\n  seed(n){ const x=Math.sin(n*99.7)*43758.5; return x-Math.floor(x); }\n  fmt(n){ return (n\u003e=0?'+':'\u2212')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US'); }\n  // Honest floors (Fix 3): a top-coded target wage is served as \u003e=$208,000,\n  // so its pay delta is \"at least\" \u2014 shown with a \u003e= prefix, never as exact.\n  fmtPay(m){ return (m&&m.floor?'\u2265':'')+this.fmt(m.pay); }\n  go(id){ const el=document.getElementById(id); if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-80,behavior:this.rm?'auto':'smooth'}); }\n  loadSoc(soc){ const db=this.state.db; if(!db) return;\n    fetch('./data/origins/'+soc+'.json').then(r=\u003e{ if(!r.ok) throw new Error('x'); return r.json(); })\n      .then(bundle=\u003e{ const title=db.occs[soc].display_title;\n        const startTour=bundle.transitions.some(t=\u003et.pareto&&t.wage_delta\u003e0)&&this.state.mode==='3d'&&!this.rm;\n        this.setState({origin:soc,bundle,query:title,err:'',drawer:null,c
